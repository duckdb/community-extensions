extension:
  name: sharepoint
  version: 2026.11.13
  description: SharePoint and OneDrive in SQL -- files (sharepoint://), Excel workbooks, SharePoint lists, search and change feeds
  language: C++
  build: cmake
  license: MIT
  # wasm: HTTPS calls to Microsoft Graph plus a loopback redirect server for
  # interactive OAuth -- neither works in a browser sandbox, and a
  # wasm side-module defers symbol resolution to load time, so it would build
  # green and then fail to LOAD.
  # mingw: vcpkg's OpenSSL port is fragile there; sibling extensions skip it.
  # osx_amd64: community-extensions no longer builds Intel macOS (2026-11), and
  # neither do we.
  excluded_platforms: "osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"
  maintainers:
    - jrosskopf
    - sipemu

repo:
  github: DataZooDE/duckdb-sharepoint
  ref: a4426c0f600408465e2f13b30a1bee72e00d78e0
  # ref builds against DuckDB 2.0 and variegata against v1.5.6
  # (community-extensions scripts/build.py); a missing key falls back to ref.
  # One commit serves both lines (duckdb-compat), so at release both are the
  # same tagged SHA. No andium key: DuckDB 1.4.x is not supported.
  variegata: a4426c0f600408465e2f13b30a1bee72e00d78e0

docs:
  hello_world: |
    -- App-only auth: an Entra ID app registration with the Sites.ReadWrite.All
    -- APPLICATION permission and admin consent. Bind it to a document library
    -- by DRIVE_ID (a Graph drive id) or SITE_ID.
    CREATE SECRET sp (
        TYPE sharepoint,
        PROVIDER client_credentials,
        TENANT_ID '00000000-0000-0000-0000-000000000000',
        CLIENT_ID '11111111-1111-1111-1111-111111111111',
        CLIENT_SECRET '...',
        DRIVE_ID 'b!AbCdEf...'
    );

    -- Read a file by path -- one Graph call, no per-segment walk.
    SELECT count(*) FROM 'sharepoint://Finance/2026/actuals.parquet';

    -- Address by driveItem id instead -- stable across a rename.
    SELECT * FROM read_csv('sharepoint://id:01ABCDEF23456789');

    -- Glob a folder.
    SELECT * FROM read_parquet('sharepoint://exports/parts/*.parquet');

    -- Write a file. Sequential only; streamed in bounded memory.
    COPY (SELECT * FROM t) TO 'sharepoint://reports/out.parquet' (FORMAT parquet);

  extended_description: |
    Registers a `sharepoint://` filesystem backed by Microsoft Graph, so any
    DuckDB path expression can address a file in a SharePoint document library
    or OneDrive with no download step. Because DuckDB dispatches file access
    through its virtual filesystem, `read_parquet`, `read_csv`, `COPY`, `glob`
    and DuckLake all inherit the scheme.

    Unlike Google Drive, Graph addresses items by path, so there is no
    path-resolution cache and no duplicate-name ambiguity. Reads are ranged
    and served from a block cache. Writes stream through a Graph upload session
    in bounded memory and the file appears when it is closed (Graph cannot
    write at a byte offset, so positional writes raise rather than corrupt).
    Beyond files: `read_excel_table` / `read_excel_range` read live Excel
    workbooks and `COPY ... (FORMAT excel_table | excel_range)` writes them
    back; `read_sharepoint_list` reads SharePoint lists as typed tables (WHERE
    pushed down to Graph on indexed columns) and `COPY ... (FORMAT
    sharepoint_list)` creates or updates items; `read_sharepoint_files` lists a
    library with its metadata; `search_sharepoint` runs Microsoft Search;
    `sharepoint_changes` / `sharepoint_list_changes` return what changed
    since a token; `?version=` reads an earlier version of a file.
    `ATTACH` a site to see its lists (and, with `WORKBOOKS`, Excel tables) in
    the catalog; the `excel` extension's `read_xlsx` / `FORMAT xlsx` work on
    `sharepoint://` paths;
    `read_docx` reads Word documents and `COPY ... (FORMAT docx, TEMPLATE ...)`
    fills templates; `read_onenote_pages`, `read_outlook_messages`,
    `read_planner_tasks` / `read_todo_tasks` and `sharepoint_permissions`
    reach OneNote, Outlook mail, tasks and sharing.
    Besides app-only client credentials or a certificate, a user can sign in
    with `device_code` or `authorization_code`. Also registers the
    scheme-generic `write_blob`, `remove_file`, `move_file` and `file_size` SQL
    functions, which work for any filesystem DuckDB can reach.

    This is **SharePoint / OneDrive via Microsoft Graph**, not Azure Blob
    Storage — a different product with a different API. For `az://`/`abfss://`
    containers use the `azure` extension.
