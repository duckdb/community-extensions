extension:
  name: pintail
  description: Lightweight Geohash utilities for DuckDB, including coordinate and geometry encoding, cell decoding, bounding boxes, and neighbors.
  version: 0.2.0
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
    - tshelianthus

repo:
  github: tshelianthus/duckdb-pintail
  ref: a91b8018c00a9e889f8215e968e42f0c6eb964dc

docs:
  hello_world: |
    INSTALL pintail FROM community;
    LOAD pintail;

    -- Recommended: GEOMETRY coordinates use longitude, latitude.
    SELECT st_geohash('POINT(121.4737 31.2304)'::GEOMETRY, 6);
    -- wtw3sj

  extended_description: |
    Pintail provides dependency-free Geohash utilities for DuckDB. New support
    references PostGIS documentation and behavior, with Pintail-specific API
    choices. Encode points, lines, polygons, multi-geometries, and collections
    using a Geohash cell that covers the entire geometry. GEOMETRY input is
    recommended for new queries and uses longitude, latitude; existing numeric
    calls retain latitude, longitude order.

    Decode Geohashes to cell-center POINTs, cell-boundary POLYGONs, or bounding-box
    STRUCTs, and find the eight neighboring cells. st_box2dfromgeohash is an alias
    of st_geohash_bbox and returns the same STRUCT. Function signatures,
    descriptions, and examples are available through duckdb_functions().

    Geometry functions use DuckDB Core GEOMETRY without requiring Spatial, GEOS,
    PROJ, or PostGIS. Decoded geometries carry EPSG:4326 coordinates.
