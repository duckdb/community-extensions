extension:
  name: sitting_duck
  description: Parse and analyze source code ASTs from 28 programming languages with tree-sitter grammars, pattern matching, and structural search
  version: 1.17.0
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
    - teaguesterling
repo:
  github: teaguesterling/sitting_duck
  # THREE KEYS, ONE COMMIT. Per scripts/build.py:42-54 they select like this:
  #
  #   ref        -> the DEFAULT build, which is the 2.0 line (v2.0.0 today)
  #   variegata  -> DuckDB v1.5.6 builds. Absent, v1.5.6 falls back to `ref`,
  #                 so it is stated explicitly rather than left to the fallback
  #   ref_next   -> a prerelease that is neither v1.4.5, v1.5.6 nor the latest
  #                 stable. build_next.yml's test_against_latest is currently
  #                 `if: false`, so this is dormant; it is set so prerelease
  #                 validation builds this release instead of printing
  #                 "Skipping prerelease validation" when that job returns.
  #
  # All three are the same commit deliberately: ONE source tree builds against
  # both DuckDB lines. The v2.0 removal of TableFunction::named_parameters goes
  # through named_parameter_compat.hpp, which declares via
  # GetSignature().WithTypedKwargs() on v2.0 and the flat map on v1.5.
  ref: cee95ef6eeb33aa6c25527769d3ebf97898aa994
  variegata: cee95ef6eeb33aa6c25527769d3ebf97898aa994
  #
  # v1.17.0 is a CORRECTNESS release with OUTPUT CHANGES, and no API removals.
  # Full notes: docs/releases/v1.17.0.md in the extension repo.
  #
  # FOUR NAME-BINDING FORMS NOW BIND, so ast_definitions() and the
  # NAME_DEFINITION flag return MORE rows than v1.16.0 did for the same
  # input: Python match/case captures (#279), comprehension targets, which
  # are now scope boundaries (#278), destructuring assignment targets (#274),
  # and for-loop and comprehension tuple targets, `for i, j in pairs` (#289).
  # Go's `for k, v := range xs` deliberately still binds nothing, because `:=`
  # binds while `=` reassigns (#277). Variadic parameters also appear in the
  # `parameters` column for go, cpp and swift, where native extraction was
  # declared but unreachable (#272). If you pin counts from ast_definitions(),
  # re-measure.
  #
  # SQL MACROS NOW CARRY DESCRIPTIONS in duckdb_functions() (#170): 58 of 97,
  # including all 52 table macros, and 13 carry examples. duckdb_functions() is
  # the only surface an agent connected to a database can read. The text is
  # lifted from the banner comment above each macro, so it cannot drift from
  # the macro. The remaining 39 scalar macros need a banner written beside
  # them; that is content work, not a defect.
  #
  # EVIDENCE. The refs above are the v1.17.0 tag, which adds the release
  # notes and nothing else: the diff from d297e858ac touches docs/ and
  # mkdocs.yml only, so every measurement below describes the same binary.
  # One run of d297e858ac on the extension repo's main, run 40626001782, is
  # completed/success with no job outside success and skipped. It covers both
  # lines:
  #
  #   v1.5.6, ci-tools @v1.5-variegata -- 9 platforms build. The suite RUNS on
  #     linux_amd64, osx_arm64, windows_amd64 and windows_amd64_mingw, each
  #     reporting `All tests passed (5 skipped tests, 9027 assertions in 162
  #     test cases)`. The other five legs are cross-compiled and run no suite.
  #   2.0 line, ci-tools @main -- two separate legs, and they differ:
  #     - the canary passes `duckdb_version: v2.0-cyanoptera` with
  #       `skip_tests: true`, so its 8 green platforms are COMPILE evidence
  #       only. A green "Test" step there executed nothing.
  #     - a dedicated leg pinned to the v2.0.0 TAG, with no skip_tests and no
  #       duckdb_tag, RUNS the suite on linux_amd64: `ran tests: 162 passed,
  #       5 skipped`.
  #
  # That second leg is new since the previous release, which had no 2.0 test
  # evidence at its ref. 2.0 test coverage is linux_amd64 only; Windows, macOS
  # and wasm on the 2.0 line are compile-checked, not tested.
  #
  # ONE FIX WORTH NAMING, because it was invisible on Linux. The header
  # generator read the .sql sources with the locale's encoding. On a Windows
  # runner that is cp1252, which breaks the em-dash separator in a macro's
  # banner comment, so one macro silently lost its description there and only
  # there -- 57 of 58 documented macros, with no error on either side. The
  # reads and the write are now pinned to UTF-8, and both decodings produce
  # byte-identical headers.
  #
  # STILL TRUE, AND THE REASON `variegata` IS SET: ast_select is 28x slower
  # per call on the 2.0 line. Measured against this registry's own pinned
  # commit, d54cbbe3df17, with one variable changed: 0.448 s per call on
  # v1.5.6 against 12.537 s. The cost is planning, not execution. Under
  # EXPLAIN ANALYZE every operator reports 0us on both lines. PREPARE does
  # not amortize it either: on the 2.0 line each EXECUTE costs the full
  # 12.6 s again, while v1.5.6 drops to 0.117 s. It is an upstream planner
  # regression, duckdb/duckdb#26036.
  #
  # It no longer reproduces on duckdb main. Built against main at ed0443f18a
  # with the same extension source, the call costs 1.192 s. That fix is on
  # main only. It is not on the v2.0-cyanoptera branch and not in any
  # release, so it does not reach this registry's 2.0 builds yet.
  #
  # So on the 2.0 default this extension builds, loads and answers correctly,
  # and its headline feature is much slower. `variegata` keeps a v1.5.6
  # artifact available while that stands.
  ref_next: cee95ef6eeb33aa6c25527769d3ebf97898aa994
docs:
  hello_world: |
    -- Parse Python code and find function definitions
    SELECT name, start_line, peek
    FROM parse_ast('
    def hello():
        return "hello world"
    def greet(name):
        print(f"Hello, {name}!")
        return name
    ', 'python')
    WHERE is_function_definition(semantic_type);

    -- Pattern matching: find eval() calls and capture arguments
    SELECT captures['X'].peek as dangerous_input, file_path, start_line
    FROM ast_match('code', 'eval(__X__)', 'python');

    -- Pattern matching with variadic wildcards
    SELECT captures['F'].name as func_name, captures['Y'].peek as return_value
    FROM ast_match('code',
        'def __F__(__):
        %__<BODY*>__%
        return __Y__', 'python');

    -- Security audit: find dangerous function calls
    SELECT * FROM ast_security_audit('code')
    WHERE risk_level = 'high';

    -- Function complexity metrics
    SELECT name, cyclomatic, max_depth, lines
    FROM ast_function_metrics('code')
    WHERE cyclomatic > 10;

    -- Cross-language analysis with semantic types
    SELECT language, COUNT(*) as functions
    FROM read_ast(['src/**/*.py', 'src/**/*.js', 'src/**/*.go'])
    WHERE is_function_definition(semantic_type)
    GROUP BY language;

  extended_description: |
    Sitting Duck is a DuckDB extension for parsing source code into Abstract Syntax Trees (ASTs)
    using tree-sitter grammars. It provides a powerful SQL interface to analyze, search, and
    understand code structure across 25+ programming languages.

    **Documentation:** https://sitting-duck.readthedocs.io/

    ## Core Features

    **Pattern Matching:**
    Find code structures using pattern-by-example matching with wildcards:
    ```sql
    -- Recursive wildcards for deep matching
    SELECT * FROM ast_match('code', 'class __C__: %__<**>__% def __M__(self): %__<BODY*>__%', 'python');

    -- Optional and negation wildcards
    SELECT * FROM ast_match('code', 'def __F__(__<?ARGS>__): %__<BODY*>__%', 'python');
    ```
    See: https://sitting-duck.readthedocs.io/en/latest/guide/pattern-matching/

    **CSS Selector Queries (v1.6.0, enhanced in v1.7.0+):**
    Query AST nodes using CSS selector syntax — bootstrapped with sitting duck's own CSS grammar:
    ```sql
    SELECT name FROM ast_select('src/*.py', '.func:has(.call#execute):not(:has(try_statement))');

    -- v1.7.0: :match (current-node) vs :contains (subtree) structural patterns
    SELECT name FROM ast_select('src/*.py', '.func:contains("db.execute()")');
    SELECT name FROM ast_select('src/*.py', 'call:match("db.execute()")');

    -- v1.7.2: parse once, query many — orders of magnitude faster for interactive use
    CREATE TABLE my_ast AS SELECT * FROM read_ast('src/**/*.py');
    SELECT * FROM ast_select_from('my_ast', '.class:named');
    SELECT * FROM ast_select_from('my_ast', '.func:has(return_statement)');
    ```
    Supports type selectors, `#name`, `.semantic` (~80 aliases), combinators, `:has()`, `:not()`,
    `:match()` / `:contains()` structural patterns, scope/call-graph pseudo-classes, and pseudo-element navigation.
    Bare type matching: `if` matches `if` + `if_statement` + `if_clause`.

    v1.10.0 adds runtime-loadable tree-sitter grammars (`register_language()`, off by
    default behind `sitting_duck_enable_runtime_grammars`), `ast_to_blocks` (render code
    structure as duck_blocks documents), and `ast_patch`/`ast_replace` (AST-anchored
    source patching and selector-driven rewriting in SQL).

    v1.9.0 hardens the selector engine: no more silent-empty results (selectors the engine
    can't honor now raise a clear error instead of returning 0 rows), `#name` on call nodes
    binds uniformly across all 27 grammars, and NULL columns no longer over- or under-match.

    **Parse-time filtering (v1.8.0):**
    `max_depth :=` and `prune :=` shrink the AST at parse time, with automatic tree healing:
    ```sql
    SELECT * FROM read_ast('file.py', max_depth := 2);
    SELECT * FROM read_ast('src/**/*.py', prune := ['syntax', 'comments', 'punctuation']);
    ```
    Prune policies: `syntax`, `comments`, `literals`, `imports`, `types`, `punctuation`,
    `unnamed`, `leaves`, `internal`.

    **Call-graph macros (v1.8.0):**
    - `ast_get_calls(source)` - calls with caller attribution and type classification
    - `ast_call_graph(source)` - aggregated caller→callee graph with call counts
    - `ast_find_references(source, name)` - scope-chain-aware symbol reference resolution

    **Table Functions:**
    - `read_ast(file_pattern, language := NULL)` - Parse source files into AST rows (parallel)
    - `parse_ast(content, language)` - Parse source code strings (table function)
    - `parse_ast_list(content, language)` - Parse source code strings (scalar, returns LIST<STRUCT>; v1.7.0)
    - `ast_match(source, pattern, lang)` - Pattern matching for code search
    - `ast_select(source, css_selector)` - CSS selector queries
    - `ast_select_from(table_name, selector)` - CSS selectors on pre-parsed tables (v1.7.2)
    - `ast_type_map(language)` - Node type discovery across languages

    **v1.7.0 extraction suffix:**
    Any extraction parameter (`context`, `source`, `structure`, `peek`) can take a `+schema`
    suffix that keeps the full column set in the output schema as NULLs without computing them:
    ```sql
    -- Keep peek column in schema but skip its computation
    SELECT name, peek FROM read_ast('file.py', peek := 'none+schema');
    ```
    Enables SQL macros to declare stable schemas regardless of which columns they populate.

    **Relational Predicates (v1.5.0):**
    - `ast_has(source, parent_type, child_type)` - Check containment relationships
    - `ast_inside(source, child_type, parent_type, parent_name)` - Find nodes inside specific parents
    - `ast_precedes(source, before_type, after_type)` - Ordering predicates
    - `ast_follows(source, after_type, before_type)` - Ordering predicates
    - `ast_not_has(source, parent_type, child_type)` - Negated containment

    **Analysis Macros (file-path based):**
    - `ast_definitions(source)` - All named definitions with categories
    - `ast_function_metrics(source)` - Cyclomatic complexity, nesting depth, line counts
    - `ast_security_audit(source)` - Detect dangerous function call patterns
    - `ast_dead_code(source)` - Find potentially unused functions/classes
    - `ast_nesting_analysis(source)` - Identify deeply nested code
    - `ast_definition_parent(table)` - Resolve nearest definition ancestor per node

    **Tree Navigation:**
    - `ast_descendants(table, node_id)` - Get subtree (O(1) using descendant_count)
    - `ast_ancestors(table, node_id)` - Path from node to root
    - `ast_children(table, node_id)` - Immediate children
    - `ast_function_scope(table, node_id)` - Function body excluding nested functions

    **Semantic Predicates:**
    Cross-language filtering with normalized types:
    - `is_function_definition(st)`, `is_class_definition(st)`, `is_variable_definition(st)`
    - `is_function_call(st)`, `is_literal(st)`, `is_conditional(st)`, `is_loop(st)`

    ## Supported Languages (27)

    | Category | Languages |
    |----------|-----------|
    | **Web** | JavaScript, TypeScript, HTML, CSS |
    | **Systems** | C, C++, Go, Rust, Zig |
    | **Scripting** | Python, Ruby, PHP, Lua, R, Bash |
    | **Enterprise** | Java, C#, Kotlin, Swift |
    | **Mobile** | Dart |
    | **Data** | SQL, JSON, TOML, GraphQL, HCL |
    | **Documentation** | Markdown |

    ## AST Schema

    Each parsed node includes:
    - `type`, `name` - Node type and extracted identifier
    - `semantic_type` - Normalized type for cross-language queries
    - `file_path`, `language` - Source location
    - `start_line`, `end_line`, `depth` - Position and nesting
    - `descendant_count` - For O(1) subtree queries
    - `peek` - Configurable source preview
    - `qualified_name` - Scope-based path unique within a file (`C[User] F[__init__]` format; v1.7.0)
    - `signature_type`, `parameters`, `modifiers`, `annotations` - Native extraction
      (v1.8.0: `modifiers[]` populated across Python, JS, TS, Rust, Kotlin, Swift, Dart, C#;
      `IS_EXPORTED` flag for file-level visibility)
    - `scope` - STRUCT<current, function, class, module, stack> (v1.7.4); replaces
      the v1.7.2 `scope_id` / `scope_stack` columns. `scope.function` lets you
      answer "what function is this in?" as a single column read.

    Full schema: https://sitting-duck.readthedocs.io/en/latest/api/output-schema/

    ## Use Cases

    - **Security auditing** - Find dangerous patterns (eval, exec, SQL injection)
    - **Code quality** - Complexity metrics, dead code detection, nesting analysis
    - **Refactoring** - Pattern-based code search across large codebases
    - **Documentation** - Extract function signatures and structure
    - **AI workflows** - Structured code understanding for LLM tools

    **GitHub:** https://github.com/teaguesterling/sitting_duck
