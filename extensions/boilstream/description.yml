extension:
  name: boilstream
  description: Remote secret storage with OPAQUE authentication, MFA login, and managed catalog discovery
  version: 0.8.1
  language: C++, Rust
  build: cmake
  license: MIT
  maintainers:
    - dforsber
  requires_toolchains: rust
  excluded_platforms: "wasm_mvp"

repo:
  github: dforsber/boilstream-extension
  ref: 19b93fac548d71e71e480e651726f4323e971f44

docs:
  hello_world: |
    INSTALL httpfs; LOAD httpfs;
    INSTALL boilstream FROM community;
    LOAD boilstream;

    -- Use your server and credentials; avoid retaining credentials in SQL history.
    PRAGMA boilstream_login('https://api.example.com/user@example.com', 'your-password', '123456');

    -- Discover catalogs and inspect available secret metadata.
    -- Login does not automatically attach catalogs.
    FROM boilstream_ducklakes();
    FROM boilstream_secrets();
    PRAGMA boilstream_help;

  extended_description: |
    BoilStream provides remote secret storage with OPAQUE password authentication,
    email/password registration, MFA login, and bootstrap-token authentication.
    It supports per-connection session state, signed requests, encrypted responses,
    and managed catalog discovery with explicit attachment.

    Version 0.8.1 hardens URL validation and credential cleanup and qualifies a
    pinned DuckDB 2.0 WASM baseline. Native macOS/Linux ARM64 and browser EH Quack
    integration were tested. The current core Quack artifact for wasm_threads is
    incompatible with shared memory; BoilStream recovery is tested, but threaded
    Quack integration is unsupported. Load threaded extensions before enabling
    query workers. MVP WASM is excluded.

    Remote operations require a compatible BoilStream server and HTTPS (HTTP is
    allowed only for exact loopback hosts). Native HTTP uses httpfs; managed Quack
    attachment requires the core quack extension. Authentication does not provide
    blanket protection against compromised TLS endpoints or embedding processes.

    See the [0.8.1 release notes](https://github.com/dforsber/boilstream-extension/releases/tag/v0.8.1)
    for validation and known limitations, including the outstanding Rust audit
    advisory and deferred host-library findings. Full browser server authentication
    and Windows/x86_64 execution have not been qualified in this release review.
