extension:
  name: urlpattern
  description: WHATWG URLPattern API for matching and extracting components from URLs using pattern syntax
  version: 0.4.3
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
  vcpkg_commit: "68a1c387f660632f2f65cdb7e8cd093a08840e5d"
  maintainers:
    - teaguesterling

repo:
  github: teaguesterling/duckdb_urlpattern
  # v0.4.3 (tag v0.4.3, released 2026-10-16). THIS IS THE COMMIT THAT BUILDS ON 2.0.
  # v0.4.2 does not: `ScalarFunction::varargs` is private on the 2.0 line, so
  # duckdb_compat.hpp:221 fails with "class duckdb::ScalarFunction has no member named
  # 'varargs'" (measured -- registry run 38928186555, four FAILED objects). v0.4.3
  # replaces that field write with a GetSignature()/AddKwargs path selected by an
  # `if constexpr` probe, so one source builds both lines.
  #
  # The registry `ref` pins the last RELEASE, not main. The fix therefore could not
  # reach this PR by landing upstream -- only by moving ref to a release containing it.
  ref: 0e14b580454ea92ff0120bdbac9ab836c407bd1b
  # variegata pins the v1.5.6 track. scripts/build.py sends a v1.5.6 build here when
  # present and to `ref` otherwise, and unlike ref_next it has no skip branch -- so
  # once `ref` is 2.0-only a v1.5.6 build would fail rather than be skipped. Equal to
  # `ref` while both lines build; advance only to a commit v1.5.6 can still build.
  # Moved with ref. v0.4.3 keeps a v1.5 `else` branch in CompatSetVarArgs and
  # CompatSetKwargs that writes the public `varargs` field, and its comments record a
  # v1.5 build that was measured and fixed during development. Holding variegata at
  # v0.4.2 would ship v0.4.2 code under the 0.4.3 label on this track. urlpattern's own
  # pipeline has no v1.5 leg, so THIS BUILD IS THE VERIFICATION: if the v1.5.6 leg
  # fails, retreat variegata to 0b7dae3e and say so rather than leaving it red.
  variegata: 0e14b580454ea92ff0120bdbac9ab836c407bd1b
  # ref_next == ref (deliberate): make test_against_latest build+test this release
  # against DuckDB v2.0-cyanoptera instead of skipping the prerelease leg.
  ref_next: 0e14b580454ea92ff0120bdbac9ab836c407bd1b
  andium: bc9864b9fad37bffe15f7499fc5b9021e970eaf8
  # andium (DuckDB v1.4.5 track) left at the pre-v1.5-variegata commit;
  # v0.4.1 targets the v1.5.x line and ships on that track via ref.
  # raw commit for refs/tags/v0.4.1 (catalog refs must not be movable tags)
  # ref_next makes the PRERELEASE leg actually build against DuckDB v2.0.
  # Without it scripts/build.py prints "Skipping prerelease validation" and the
  # run passes green having verified nothing on that line.
  #
  # Deliberately NOT the same commit as ref. v0.4.1 (ref, tagged 2026-07-19)
  # predates the v2.0 compat work: it assigns ScalarFunction::varargs and
  # ::null_handling as public fields, which v2.0-cyanoptera moved into
  # FunctionSignature behind Get/SetVarArgs and Get/SetNullHandling. Commit
  # 25284e3 (2026-09-05) routes those through feature-detecting helpers in
  # src/include/duckdb_compat.hpp. ref_next therefore points at current main,
  # so the prerelease leg validates the code that actually compiles on v2.0,
  # while ref keeps shipping the released v0.4.1 on the stable line.

docs:
  hello_world: |
    -- Test if a URL matches a pattern
    SELECT urlpattern_test('https://example.com/users/:id', 'https://example.com/users/123');
    -- true

    -- Extract a named group from a URL
    SELECT urlpattern_extract('https://example.com/users/:id', 'https://example.com/users/123', 'id');
    -- '123'

    -- Get full match results with all components
    SELECT urlpattern_exec('/posts/:slug', '/posts/hello-world');
    -- {matched: true, pathname: '/posts/hello-world', groups: {slug: 'hello-world'}, ...}

    -- Use the URLPATTERN type for validated patterns
    SELECT urlpattern_test(urlpattern('/api/:version/*'), '/api/v2/users/list');
    -- true

  extended_description: |
    The URLPattern extension implements the [WHATWG URLPattern API](https://urlpattern.spec.whatwg.org/)
    for DuckDB, enabling powerful URL matching, extraction, parsing, and construction.

    ## Features

    - **Custom URLPATTERN type** with validation and implicit casting from VARCHAR
    - **Pattern matching** with named groups (`:name`), wildcards (`*`), and regex groups
    - **URL parsing** into components (protocol, host, path, query, hash)
    - **URL building** and modification from components
    - **Query parameter extraction** as MAP or individual values
    - **Pattern caching** for improved performance (~320k matches/sec)

    ## Key Functions

    | Function | Description |
    |----------|-------------|
    | `urlpattern_test(pattern, url)` | Test if URL matches pattern |
    | `urlpattern_extract(pattern, url, group)` | Extract a named group |
    | `urlpattern_exec(pattern, url)` | Get full match results as STRUCT |
    | `url_parse(url)` | Parse URL into struct with all components |
    | `url_build(...)` | Build URL from named components |
    | `url_modify(url, ...)` | Modify existing URL components |
    | `url_search_params(url)` | Get query parameters as MAP |

    ## Pattern Syntax

    URLPattern uses a syntax similar to Express.js routes:
    - `:name` - Named parameter (matches any segment)
    - `*` - Wildcard (matches everything)
    - `/path/:id` - Path-only patterns match any protocol/host

    For full documentation, see [duckdb-urlpattern.readthedocs.io](https://duckdb-urlpattern.readthedocs.io/).
