extension:
  name: ai
  description: "Call LLMs from SQL: classify, summarize, extract typed fields, embed text and ask questions about your tables, with Ollama, OpenAI, Claude, Gemini and more"
  version: 0.7.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads"
  maintainers:
    - leonardovida

repo:
  github: leonardovida/duckdb-ai
  ref: 3f9125bbfbe8b19c6ffb22cb0f424014b23e1d5e

docs:
  hello_world: |
    -- Free and local: install Ollama (https://ollama.com), then run `ollama pull qwen3.8:27b`
    SET duckdb_ai_provider = 'ollama';
    SET duckdb_ai_model = 'qwen3.8:27b';

    CREATE TABLE tickets AS SELECT * FROM (VALUES
        (1, 'I was charged twice for the same invoice.'),
        (2, 'The dashboard has been down for every user since 9am.')
    ) t(id, body);

    -- A label and a summary for every row
    SELECT id,
           ai_classify(body, ['billing', 'outage', 'other']) AS category,
           ai_summarize(body) AS summary
    FROM tickets;

    -- Typed fields from a JSON Schema, usable like any other column
    SELECT id, r.product_area, r.urgency
    FROM (SELECT id, ai_extract_record(body, '{"type": "object",
            "properties": {"product_area": {"type": "string"}, "urgency": {"type": "integer"}},
            "required": ["product_area", "urgency"]}') AS r
          FROM tickets);

    -- Decision models return probabilities instead of text (`ollama pull nimble`)
    SELECT id, ai_decide(body, {urgent: MAP {'true': 'Needs action now', 'false': 'Can wait'}},
                         provider := 'ollama') AS decision
    FROM tickets;

    -- Hosted models read API keys from the environment (here OPENAI_API_KEY), never from SQL
    SELECT ai_complete('Describe DuckDB in one sentence.', provider := 'openai', model := 'gpt-5.6-luna');

    -- Calls, tokens, retries and estimated cost so far
    FROM ai_usage_summary();
  extended_description: |
    The `ai` extension calls large language models, embedding models and decision models from DuckDB SQL,
    one row at a time or over whole tables.

    **What you can do**

    - Enrich rows: `ai_classify`, `ai_summarize`, `ai_translate`, `ai_filter`, `ai_score`, `ai_redact`, `ai_complete`.
    - Get typed results instead of text: `ai_extract_record` returns a `STRUCT` from a JSON Schema,
      `ai_complete_json` validates JSON, and `ai_decide` returns calibrated probabilities from decision models
      (TypeSafe Jev, Cloudflare Clef, Perplexity, Ollama).
    - Search by meaning: `ai_embed`, `ai_similarity`, `ai_rerank`, and chunking with `ai_generate_chunks` and `ai_prep_search`.
    - Summarize groups with the `ai_agg` and `ai_summarize_agg` aggregates.
    - Ask questions about your tables: `ai_sql` returns a validated read-only `SELECT`, and `ai_query_data` runs it.

    **Providers**

    Local models through Ollama, llama.cpp or any OpenAI-compatible server, and hosted models from OpenAI,
    Anthropic, Google Gemini, Azure OpenAI, Amazon Bedrock, Google Vertex AI, Databricks, Snowflake Cortex,
    OpenRouter, Mistral, DeepSeek and more than 20 others. One SQL interface works across all of them.

    **Built for production and for agents**

    - Row-level error capture with `ai_try_complete`, retries with backoff, rate and concurrency limits,
      an opt-in response cache, and usage and cost tracking with `ai_usage()`.
    - API keys come only from environment variables or `TYPE duckdb_ai` secrets. Loading the extension makes no
      network calls, `allowed_hosts` restricts where data can go, and `ai_completion_request_json` previews a
      request without sending it.
    - Documentation: https://leonardovida.github.io/duckdb-ai/. Agents can read the full docs as plain text from
      https://leonardovida.github.io/duckdb-ai/llms-full.txt.
