extension:
  name: pgvfs
  description: DuckLake on PostgreSQL - a pgvfs:// filesystem storing data files as PostgreSQL rows, for one writer and many readers
  version: 0.2.0-beta.1
  language: C++
  build: cmake
  license: Apache-2.0
  requires_toolchains: "rust"
  excluded_platforms: "osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools"
  opt_in_platforms: "linux_amd64_musl;linux_arm64_musl"
  maintainers:
    - adonm

repo:
  github: adonm/pgvfs
  ref: 0364b26e1df71bf1db5fe7eef1ffd4a2f93b398c

docs:
  hello_world: |
    CREATE SECRET (TYPE postgres, HOST 'db', USER 'lake', PASSWORD '...', DATABASE 'lake');
    ATTACH 'ducklake:postgres:' AS lake (DATA_PATH 'pgvfs://lake/');
    CREATE TABLE lake.t AS SELECT range AS i FROM range(1000);
    SELECT count(*) FROM lake.t;
  extended_description: |
    pgvfs stores DuckLake's data files as rows in PostgreSQL, next to the DuckLake
    catalog, so one PostgreSQL database is the whole lake. Readers need only SELECT
    and can run on read replicas; one process writes. See https://pgvfs.adonm.dev.
