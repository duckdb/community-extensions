    - [ROOT reading pipeline](https://github.com/LordVitiate/root4duckdb/blob/main/docs/root-reading-pipeline.md)
    - [Build instructions](https://github.com/LordVitiate/root4duckdb/blob/main/docs/building-from-source.md)
