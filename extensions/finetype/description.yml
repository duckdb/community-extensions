extension:
  name: finetype
  description: Semantic type classification — detects 251 data types (emails, URLs, dates, UUIDs, currencies, etc.) from raw strings
  version: 0.6.65
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw"
  # osx_amd64 became opt-in in the DuckDB 2.0 matrix, and is opted into so
  # Intel Macs keep a build.
  opt_in_platforms: "osx_amd64"
  requires_toolchains: "rust"
  maintainers:
    - hughcameron

repo:
  github: meridian-online/finetype
  ref: 0b08087d548294cff1bd26119493bab96abf2976
  ref_next: 0b08087d548294cff1bd26119493bab96abf2976
  variegata: a8ec8663862d28b1b9e0794f5026efbdb2ea3836

docs:
  hello_world: |
    -- Profile every column of a table: one row per column, with the detected
    -- semantic type, model confidence, and recommended DuckDB storage type.
    D CREATE TABLE people AS SELECT * FROM (VALUES
        ('jane.doe@company.co.uk', '+44 20 7946 0958', {'city': 'London'}),
        ('john.smith@example.org', '0117 496 0123',    {'city': 'Bristol'}),
        ('not-an-email',           'not-a-phone',       {'city': 'Leeds'})
      ) AS t(email, phone, addr);

    D SELECT * FROM ft_profile('people');
    ┌─────────────┬──────────────────────────────────────────────────────────────────────────────────┬────────────────────┬─────────────┐
    │ column_name │                                       type                                       │     confidence     │ duckdb_type │
    │   varchar   │                                     varchar                                      │       double       │   varchar   │
    ├─────────────┼──────────────────────────────────────────────────────────────────────────────────┼────────────────────┼─────────────┤
    │ addr        │ nested STRUCT(city VARCHAR) column — unnest / to_json / extract before profiling │               NULL │ NULL        │
    │ email       │ identity.person.email                                                            │ 0.5915254950523376 │ VARCHAR     │
    │ phone       │ identity.person.phone_number                                                     │                0.5 │ VARCHAR     │
    └─────────────┴──────────────────────────────────────────────────────────────────────────────────┴────────────────────┴─────────────┘
    -- (addr is a nested STRUCT column: instead of silently mis-classifying it,
    --  ft_profile emits a flatten hint in the type column and leaves
    --  confidence / duckdb_type NULL. See the nested-column note below.)

    -- Validate a table against a JSON Schema (note the top-level "properties"
    -- key): one row per column, counting how many values the schema rejects.
    D SELECT * FROM ft_validate('people',
        '{"properties":{"email":{"type":"string","pattern":"^[^@]+@[^@]+\\.[^@]+$"},
                        "phone":{"type":"string","pattern":"^\\+?[0-9().+ -]{7,}$"}}}');
    ┌─────────────┬───────┬─────────┬───────────────────────────────────────────────────────────────────────────────────┐
    │ column_name │ total │ rejects │                                  sample_message                                   │
    │   varchar   │ int64 │  int64  │                                      varchar                                      │
    ├─────────────┼───────┼─────────┼───────────────────────────────────────────────────────────────────────────────────┤
    │ addr        │  NULL │    NULL │ nested STRUCT(city VARCHAR) column — unnest / to_json / extract before validating │
    │ email       │     3 │       1 │ "not-an-email" does not match "^[^@]+@[^@]+\.[^@]+$"                              │
    │ phone       │     3 │       1 │ "not-a-phone" does not match "^\+?[0-9().+ -]{7,}$"                               │
    └─────────────┴───────┴─────────┴───────────────────────────────────────────────────────────────────────────────────┘

    -- Classify a single value (per-value, no column context)
    D SELECT ft_infer('https://example.com') AS detected_type;
    ┌──────────────────────────┐
    │      detected_type       │
    │         varchar          │
    ├──────────────────────────┤
    │ technology.internet.url  │
    └──────────────────────────┘

  extended_description: |
    FineType is a semantic type classifier that detects 251 data types from raw string values. A
    multi-branch neural network labels each value, mapping it into a three-level taxonomy:
    `domain.category.type`.

    FineType is **column-oriented**: its accuracy comes from seeing a whole column at once, so the
    primary surface is the `ft_profile` / `ft_validate` **table verbs** below. Per-value scalar
    functions are also provided for ad-hoc classification, but a lone value that normally leans on its
    column neighbours to disambiguate (a bare UUID, a phone number) is classified less confidently
    than the same value seen in column context.

    ## Table verbs

    These take a table (or a `LIST` of column values) and return **one row per column** — the natural
    grain for profiling and validation.

    ### `ft_profile(table_name VARCHAR)`
    Profile every column of a table. Returns `(column_name, type, confidence, duckdb_type)`,
    one row per column. The table is named as a string literal; FineType reaches into the catalog to
    read its columns.

    ```sql
    SELECT * FROM ft_profile('people');
    ```

    Nested `STRUCT` / `LIST` columns are **guarded, not silently rejected**: rather than forcing them
    through per-value classification that would misreport them, `ft_profile` returns a flatten hint in
    the `type` column (with `confidence` and `duckdb_type` left `NULL`). Flatten the column first if you
    need it typed.

    ### `ft_validate(table_name VARCHAR, schema_json VARCHAR)`
    Validate a table's columns against a JSON Schema. Returns one row per validated column with the
    total values checked, the reject count, and a sample rejection message. The schema can be supplied
    inline, via `getvariable`, or read from a file — a bare path is read for you, while a string
    starting with `{` is used as-is.

    The JSON Schema is keyed by column under a top-level `properties` object.

    The constraints that are **asserted** are `pattern`, `minLength`, `maxLength`, `enum`, `type` and
    `required`. Per the JSON Schema specification, `format` is an annotation rather than an assertion:
    `{"format":"email"}` describes the column and rejects nothing. Use `pattern` when you want values
    counted as rejects.

    ```sql
    -- inline
    SELECT * FROM ft_validate('people', '{"properties":{"email":{"type":"string","pattern":"^[^@]+@[^@]+\\.[^@]+$"}}}');

    -- via a variable, when the schema is long enough to want a name
    SET VARIABLE email_schema = '{"properties":{"email":{"type":"string","minLength":6}}}';
    SELECT * FROM ft_validate('people', getvariable('email_schema'));
    ```

    ## Aggregate functions

    ### `ft_profile(value VARCHAR[, header VARCHAR]) → STRUCT(type VARCHAR, confidence DOUBLE, duckdb_type VARCHAR)`
    Profile one column directly, as an **aggregate** over its values — useful when the column is in
    hand and you do not want to name a table. It goes in a `SELECT` rather than a `FROM`, and returns
    one `STRUCT` rather than a row per column.

    **Pass the column name as the second argument.** FineType uses the header as evidence, so the
    two-argument form is what reproduces the `ft_profile(table)` answer; without it the same values
    can land on a different type.

    ```sql
    SELECT ft_profile(email, 'email') FROM people;
    -- {'type': identity.person.email, 'confidence': 0.5915254950523376, 'duckdb_type': VARCHAR}

    SELECT ft_profile(email) FROM people;  -- no header: less evidence, different answer
    -- {'type': representation.text.plain_text, 'confidence': 0.6070796251296997, 'duckdb_type': VARCHAR}
    ```

    Because it is an aggregate, it cannot take `list(...)` — nesting one aggregate inside another is a
    binder error. Pass the column itself, and use `GROUP BY` for one answer per group. `FILTER` and
    `DISTINCT` work too. An aggregate-level `ORDER BY` inside the call
    (`ft_profile(value ORDER BY value)`) works on DuckDB 2.0 and crashes DuckDB 1.5, a DuckDB bug fixed
    in 2.0 and not backported.

    ### `ft_detail(value VARCHAR[, header VARCHAR]) → VARCHAR`
    Explain the verdict `ft_profile` gives a column. An **aggregate** over the same sample as
    `ft_profile`, so over the same rows its `type` is `ft_profile`'s. Returns JSON with the type,
    confidence (0.0–1.0), the recommended DuckDB type, the number of values sampled, the rule that
    decided the type when one fired, and the per-label vote map. It takes the same `GROUP BY`,
    `FILTER`, `DISTINCT` and `ORDER BY` forms as `ft_profile`, with the same DuckDB 1.5 caveat on
    `ORDER BY`.

    ```sql
    SELECT ft_detail(email, 'email') FROM people;
    -- {"type": "identity.person.email", "confidence": 0.592, "duckdb_type": "VARCHAR", "samples": 3,
    --  "disambiguation": "header_hint_cross_domain:email", "votes": {...}}
    ```

    Since 0.6.61 `ft_detail` is an aggregate only: the per-value `ft_detail(value)` scalar and the
    `ft_detail(list(...))` forms are retired. To classify one value, use `ft_infer`.

    ## Scalar functions

    Per-value classification, one value at a time. Strongest on values unambiguous in isolation (URLs,
    ISO dates, well-formed emails, IP addresses).

    ### `ft_infer(value VARCHAR) → VARCHAR`
    Classify a single value. Returns the full semantic type label.

    ```sql
    SELECT ft_infer('https://example.com');  -- technology.internet.url
    SELECT ft_infer('2024-01-15');           -- datetime.date.iso
    SELECT ft_infer('true');                 -- representation.boolean.terms
    ```

    ### `ft_cast(value VARCHAR) → VARCHAR`
    Normalize a value for safe `TRY_CAST()` to its detected DuckDB type. Handles date format
    conversion (US/EU → ISO), boolean normalization, UUID lowercasing, numeric cleanup.

    ```sql
    SELECT ft_cast('01/15/2024');  -- 2024-01-15 (US date → ISO)
    ```

    ### `ft_validate_text(value VARCHAR, schema_json VARCHAR) → STRUCT(valid BOOLEAN, "constraint" VARCHAR, message VARCHAR, grade VARCHAR, note VARCHAR)`
    Validate a single value against a JSON Schema fragment. Returns a struct: `valid` is `true` when
    the value conforms (with `constraint` and `message` `NULL`); on failure `valid` is `false` and
    `constraint` / `message` name the failing keyword and the reason. This is the per-cell engine the
    `ft_validate` table verb runs over every column.

    `grade` is `conforms`, `noted` or `fails`. A `noted` value is valid but carries a `note`, such as
    a non-canonical form (an uppercase UUID) or a withdrawn code, when the fragment declares the
    `x-finetype-canonical` or `x-finetype-historic` extension. `valid` still means "not a failure".
    The scalar applies the same per-value check as `finetype validate`: enum membership ignores
    letter-case, and when the fragment's `x-finetype-label` names a type with a check digit (ISBN,
    IBAN, NPI and others), a right-shape value with a bad check digit fails with constraint
    `checksum`.

    ```sql
    SELECT ft_validate_text('not-an-email', '{"type":"string","pattern":"^[^@]+@[^@]+\\.[^@]+$"}');
    -- {'valid': false, 'constraint': pattern, 'message': '"not-an-email" does not match "^[^@]+@[^@]+\.[^@]+$"', 'grade': fails, 'note': NULL}

    SELECT ft_validate_text('550E8400-E29B-41D4-A716-446655440000',
      '{"type":"string","pattern":"^[0-9a-fA-F-]{36}$",
        "x-finetype-canonical":{"kind":"non_canonical","name":"lowercase","pattern":"^[^A-F]*$"}}');
    -- {'valid': true, 'constraint': NULL, 'message': NULL, 'grade': noted, 'note': 'non_canonical: lowercase'}

    SELECT ft_validate_text('0306406153',
      '{"type":"string","pattern":"^[0-9]{9}[0-9X]$","x-finetype-label":"identity.commerce.isbn"}');
    -- {'valid': false, 'constraint': checksum, 'message': '"0306406153" fails its isbn check digit', 'grade': fails, 'note': NULL}
    ```

    ### `ft_unpack(json VARCHAR) → VARCHAR`
    Recursively classify every scalar value in a JSON document. Returns annotated JSON carrying the
    type, confidence, recommended DuckDB type, and original value for each field.

    ### `ft_version() → VARCHAR`
    Returns the extension version string.

    > **Names.** Every function carries the `ft_` prefix. The earlier un-prefixed names (`finetype`,
    > `finetype_detail`, `finetype_cast`, …) were removed in 0.6.57; the migration table is in the
    > FineType changelog.

    ## Type Taxonomy

    251 types organized into 7 domains:
    - **container**: JSON, XML, CSV, arrays, key-value (12 types)
    - **datetime**: dates, times, timestamps, epochs, durations, offsets (89 types)
    - **finance**: currencies, accounting, market identifiers, transactions (29 types)
    - **geography**: coordinates, locations, addresses, transportation (25 types)
    - **identity**: names, emails, phones, payments, medical (34 types)
    - **representation**: booleans, numbers, text, files, scientific (32 types)
    - **technology**: URLs, IPs, UUIDs, versions, codes (30 types)

    For more information, see the [FineType documentation](https://github.com/meridian-online/finetype).
