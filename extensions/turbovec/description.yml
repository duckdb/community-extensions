extension:
  name: turbovec
  description: Compressed vector search for DuckDB — 2/3/4-bit TurboQuant quantization (random-rotation, training-free) with flat and IVF indexes, ensembles for recall recovery, and a process-wide index cache, through DuckDB's C Extension API (quack-rs)
  version: 0.3.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "linux_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
  requires_toolchains: "rust;python3"
  maintainers:
    - alitrack

repo:
  github: alitrack/duckdb_turbovec
  ref: 6e7514ed7c784f6bdf4d20617ab64596b78539e9
  ref_next: 6e7514ed7c784f6bdf4d20617ab64596b78539e9

docs:
  hello_world: |
    INSTALL turbovec FROM community;
    LOAD turbovec;

    -- Build a 4-bit quantized flat index from a vectors table
    SELECT * FROM turboquant_build(
      (SELECT string_agg(list_serialize(embedding), chr(10)) FROM docs),
      1536, 4, '/tmp/myindex.tv'
    );

    -- Search: exact-k quantized top-k (idx, score)
    SELECT * FROM turboquant_search('/tmp/myindex.tv', '[0.1, ...]', 10);

    -- IVF for sub-linear search at scale (auto num_lists = sqrt(n))
    SELECT * FROM turboquant_build_ivf(
      (SELECT string_agg(list_serialize(embedding), chr(10)) FROM docs),
      1536, 4, 0, '/tmp/myivf/'
    );
    SELECT * FROM turboquant_search_ivf('/tmp/myivf/', '[0.1, ...]', 10);

  extended_description: |
    ## turbovec — Compressed Vector Search for DuckDB

    A native Rust DuckDB loadable extension for **extremely compressed
    vector search**, built on
    [TurboQuant](https://arxiv.org/abs/2504.19874) (Zandieh et al., 2025;
    Rust crate [turbovec](https://crates.io/crates/turbovec)):
    a random rotation concentrates vector coordinates into a near-uniform
    distribution, after which **2, 3 or 4 bits per dimension** quantize
    with near-optimal distortion — no training pass, no codebook fitting.

    ### Why compressed vectors

    Measured on real OpenAI embeddings (1,472 docs × 1536 dims,
    recall@10 vs exact brute force, i5-14600K):

    | Index | Size | Query p50 | recall@10 |
    |---|---|---|---|
    | 4-bit flat | 2.8 MB | 0.84 ms | 0.888 |
    | 4-bit IVF | 3.0 MB | 0.83 ms | 0.849 |
    | 4-bit ensemble ×4 | 11.2 MB | 1.48 ms | 0.939 |

    At 100k × 1536 vectors the 4-bit index is ~0.08 GB (a full-precision
    copy would be ~0.6 GB), with IVF search at ~1.8 ms after the
    process-wide index cache warms up.

    ### Functions

    | Function | Description |
    |---|---|
    | `turboquant_build(vectors, dim, bit_width, path)` | Build a flat quantized index → file |
    | `turboquant_search(path, query, k)` | Quantized top-k from a flat index |
    | `turboquant_score(path, query, k)` | Score-style variant |
    | `turboquant_build_ivf(vectors, dim, bit_width, num_lists, dir)` | Build an IVF index (k-means++ seeding, parallel Lloyd, `num_list=0` → auto √n; single-file v2 layout) |
    | `turboquant_search_ivf(dir, query, k)` | Probe `nprobe` lists (default 8) and merge |
    | `turboquant_build_ensemble(vectors, dim, bit_width, members, dir)` | Build m permutation-decorrelated indexes for recall recovery |
    | `turboquant_search_ensemble(dir, query, k)` | Average-fused search over ensemble members |

    `bit_width` ∈ {2, 3, 4} (kernel hard limit); `members` ∈ [1, 8].

    ### Design notes

    - **Training-free**: TurboQuant needs no k-means codebook fitting for
      quantization itself (the random rotation is analytic), so building a
      flat index is a single pass.
    - **IVF v2 layout**: all vectors live in one id-mapped index file in
      cluster-contiguous slot order; probing a list translates to a slot
      range on the search allowlist. One shared rotation matrix and
      codebook instead of one per cluster — a 32-list index shrinks from
      53.8 MB to 3.0 MB on the 1,472-doc dataset.
    - **Ensembles for recall**: quantization noise across members (each
      behind its own deterministic dimension permutation) averages down
      ~1/√m; 2 members at 4-bit ≈ the memory of a hypothetical 8-bit index
      with recall 0.916 vs 0.888 single.
    - **Index cache**: loaded indexes are cached process-wide (path-keyed,
      FIFO), so repeated queries skip the file read — 21× faster repeated
      IVF search on a 100k-vector index.

    Excluded platforms match the other quack-rs based community extensions
    (Windows and musl pending CI coverage).

    → [GitHub](https://github.com/alitrack/duckdb_turbovec)
