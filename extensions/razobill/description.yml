extension:
  name: razobill
  description: High-performance lossless log parsing, analytical database compaction, and information-theoretic semantic accounting.
  version: 1.0.1
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
    - 4t1a

repo:
  github: 4t1a/razobill
  ref: 38cc9c2dc360b3e5aee1593cadfdf560e3b99c81

docs:
  hello_world: |
    -- Install and load the Razobill extension
    INSTALL razobill FROM community;
    LOAD razobill;

    -- Vectorized single-pass composite struct decomposition: STRUCT(form VARCHAR, ints BIGINT[], strs VARCHAR[])
    SELECT rbDecompose('2026-10-10 12:00:00 [INFO] Worker 42 finished job in 150ms') AS parsed;

    -- Extract lossless structural form and typed variable columns
    SELECT rbForm('User 1042 authenticated') AS form,
           rbInts('User 1042 authenticated') AS ints,
           rbStrs('User 1042 authenticated') AS strs;

    -- Exact bit-for-bit lossless log reconstruction
    SELECT rbReconstruct(form, ints, strs) AS reconstructed
    FROM (SELECT (rbDecompose('User 1042 authenticated')).*);

  extended_description: |
    Razobill is a high-performance C++20 log parsing and analytical database compaction engine grounded in "Latitude and Doubt" (M. M. Atta, 2026).
    It provides exact byte-for-byte lossless log reconstruction while reducing raw log storage by 45%+ in DuckDB and 93.8% in columnar cloud storage (AWS S3 Parquet).
