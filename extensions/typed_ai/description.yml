extension:
  name: typed_ai
  description: Ask a model yes/no, pick-one and score questions about your rows, with real probabilities and spending capped by default
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads"
  maintainers:
    - hfmsio

repo:
  github: hfmsio/duckdb-typed-ai
  ref: d99fa461d5722e48136277ac788068e7fad6a1b9
  ref_next: d99fa461d5722e48136277ac788068e7fad6a1b9

docs:
  hello_world: |
    -- Audit a chatbot: did each answer stick to its source? Needs TYPESAFE_API_KEY, or a local model profile.
    CREATE SECRET jev (TYPE typed_ai, PROVIDER 'jev', API_KEY getenv('TYPESAFE_API_KEY'));
    -- No key? A free local model works too (weaker answers):
    -- CREATE SECRET local (TYPE typed_ai, PROVIDER 'openai', MODEL 'gemma2:2b',
    --   URL 'http://localhost:11434/v1/chat/completions', USD_PER_MTOK_IN 0, USD_PER_MTOK_OUT 0);
    CREATE TABLE bot_answers AS SELECT * FROM (VALUES
      ('Can I take photos?', 'Photography without flash is allowed in all galleries.', 'Yes, flash is fine everywhere.'),
      ('How heavy is the meteorite?', 'The Ashford meteorite weighs 412 kilograms.', 'It weighs about 412 kg.')
    ) t(question, source, answer);
    CREATE TABLE topics AS SELECT * FROM (VALUES ('visiting rules'), ('science'), ('history')) t(name);

    -- Price it first: no calls, no cost
    SET typed_dry_run = true;
    SELECT typed_prob(b, 'the answer is fully supported by the source') FROM bot_answers b;
    SELECT dry_run_usd FROM typed_usage();
    SET typed_dry_run = false;

    -- The whole row goes in, so the model compares answer and source
    SELECT answer, typed_prob(b, 'the answer is fully supported by the source') AS supported FROM bot_answers b;

    -- Options can come from a table
    SELECT question, typed_pick(question, 'what is the visitor asking about?', (SELECT list(name) FROM topics)) FROM bot_answers;
  extended_description: |
    `typed_ai` asks a model typed questions about rows and returns the model's own odds as probabilities.
    It works with [TypeSafe Jev](https://docs.typesafe.ai) and with any OpenAI-compatible server that returns
    `logprobs`, including a local Ollama or vLLM.

    | Function | Returns |
    | --- | --- |
    | `typed_is(input, statement [, threshold])` | `BOOLEAN`, for `WHERE` |
    | `typed_prob(input, statement)` | probability of yes, 0 to 1 |
    | `typed_pick(input, question, options)` | the option the model rates highest; options can come from a table |
    | `typed_score(input, question, levels)` | probability-weighted level |
    | `typed_ask(input, question_json)` | the full answer as JSON |
    | `typed_usage()` | spend, budget, requests, cache and breaker state |

    Spending is capped from the first query: 1,000 rows per query and $1.00 per database until you raise
    `typed_max_rows` or `typed_budget_usd`. `typed_dry_run` prices a query without calling anything. A job that
    stops partway keeps every answer it paid for, so running it again costs only the missing rows.

    Every value you judge is sent to the provider named in your profile (a DuckDB secret), over https unless that
    server runs on your own machine; keep private data on a local model. HTTP goes through `httpfs`, loaded on first use.
