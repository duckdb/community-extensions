extension:
  name: oracle_scanner
  description: Read and write Oracle Database with no Oracle client
  version: '0.6.0'
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
    - krokozyab
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw
  requires_toolchains: vcpkg

repo:
  github: krokozyab/quack-oracle
  # The commit tagged v0.6.0, built for DuckDB v2.0.0, pinned by SHA so what is
  # built cannot move.
  ref: 62a2d77685c8365c80639e8f6110d68efb83660b
  # DuckDB 1.5.6 stays on v0.4.0, the last release built for that line.
  variegata: d4aa50f9bf23ca44b44f0df48fb0065ba751f5be
