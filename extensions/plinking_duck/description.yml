extension:
  name: plinking_duck
  description: Read and write PLINK 2 genomics file formats and run common genetic analyses directly in SQL
  version: 0.16.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "windows_amd64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl"
  maintainers:
    - teaguesterling

repo:
  github: teaguesterling/plinking_duck
  # Post-#3079 keys: ref = the default build (the DuckDB 2.0 line, v2.0.0); variegata
  # = the DuckDB v1.5.6 build (explicit, not left to fall back to ref); ref_next = the
  # dormant prerelease slot (build_next test_against_latest is if:false).
  #
  # v0.16.0 is a FEATURE release and is v2.0.0-ONLY. It opens pfile_catalog to ATTACH
  # (TYPE pfile_catalog) as a read-only database, completes the sample axis for both
  # reading (read_pfile combine_samples) and writing (COPY ... shard_samples), and adds
  # the two-axis matrix writer (COPY ... shard_by '<v>' shard_samples {...} -> a
  # pfile_catalog:2 grid). The DuckDB v1.5.6 variant build stays RETIRED.
  #
  # So ref / ref_next advance to the v0.16.0 commit (9a8d4b3) while variegata stays
  # PINNED at the v0.14.2 commit (7a34f3ab) — the last commit that builds on v1.5.6.
  # variegata cannot advance (v0.16.0 uses v2.0-only APIs) and must not be dropped
  # (absent -> v1.5.6 falls back to ref -> builds the v2.0-only tree on v1.5.6 and
  # fails). Net: v1.5.6 users keep v0.14.2; the 2.0 line gets v0.16.0. ref_next == ref.
  # 9a8d4b3 is green on both release legs of its push-to-main run (42669269984): ref
  # (v2.0.0) and ref_next (cyanoptera, v2.0), each on linux amd64/arm64 + osx arm64.
  ref: 9a8d4b3db110b7e0194f808d8cb4310372fae1f4
  variegata: 7a34f3ab8d76534aaebed0aaa88e8ef27099f4e6
  ref_next: 9a8d4b3db110b7e0194f808d8cb4310372fae1f4

docs:
  hello_world: |
    -- Read variant metadata from a .pvar file
    SELECT CHROM, POS, ID, REF, ALT
    FROM read_pvar('cohort.pvar')
    WHERE CHROM = '22';

    -- Read genotypes in tidy format (one row per variant x sample)
    SELECT chrom, pos, iid, genotype
    FROM read_pfile('cohort', orient := 'genotype')
    LIMIT 10;

    -- Compute allele frequencies
    SELECT * FROM plink_freq('cohort.pgen')
    WHERE ALT_FREQ > 0.01;

    -- Run a GWAS association test
    SELECT * FROM plink_glm('cohort')
    WHERE p_value < 5e-8;

  extended_description: |
    PlinkingDuck brings [PLINK 2](https://www.cog-genomics.org/plink/2.0/) genotype,
    variant, and sample data into DuckDB, letting you query genomics datasets with
    standard SQL instead of format-specific command-line tools.

    **File readers:**
    - `read_pvar(path | [paths])` — variant metadata (.pvar/.bim); a list row-concatenates multiple files
    - `read_psam(path)` — sample metadata (.psam/.fam)
    - `read_pgen(path)` — binary genotypes (.pgen)
    - `read_pfile(prefix | [prefixes])` — unified fileset reader with orient modes (variant/genotype/sample), sample subsetting, region and variant filtering; a list of prefixes reads a variant-sharded fileset (identical samples) as one table, and `combine_samples := 'concatenate' | 'disjoint'` reads a sample-sharded cohort (one shared `.pvar`) as one table
    - `read_plink_vcf(path)` — fast biallelic genotype extraction from VCF/VCF.gz (~3x faster than htslib)

    **Writing & catalogs:**
    - `COPY (…) TO 'out' (FORMAT pvar | psam | pgen | pfile)` — write PLINK 2 filesets from SQL. `shard_by '<col>'` splits a cohort into one fileset per key (e.g. per chromosome); `shard_samples {label: [iids], …}` splits it along the sample axis into named groups over one shared `.pvar`; giving both at once writes a **matrix** — an M × N grid of filesets described by a `"pfile_catalog": 2` catalog
    - `.pfile.json` catalog — a thin JSON catalog over a set of filesets (a shared `.pvar`/`.psam` plus per-file partition and genomic-range annotations); the sharded writers emit one as their manifest. The **matrix form** (`"pfile_catalog": 2`) tiles a sparse 2-axis variants × samples grid of filesets with catalog-defined typed keys, pruned on both axes
    - `ATTACH 'cohort.pfile.json' (TYPE pfile_catalog)` — expose any catalog (a single fileset, a sharded cohort, or a matrix) as a read-only database with `variants`, `samples`, `genotypes`, `cells`, and per-axis block relations; pushdown-aware and DETACH-clean
    - `read_pfile_catalog(path)` — parse, verify, and prune a catalog (1-D or the v2 matrix), returning one row per surviving shard/cell with resolved companion paths (text or parquet)
    - `read_pfile_catalog_metadata(path)` / `read_pfile_catalog_layout(path)` — inspect a catalog without reading data: its declared schema, and its full chunk map (one row per cell, holes included)

    **Analysis functions:**
    - `plink_freq` — per-variant allele frequencies via fast genotype counting
    - `plink_hardy` — Hardy-Weinberg equilibrium exact test
    - `plink_missing` — per-variant or per-sample missingness rates
    - `plink_ld` — pairwise linkage disequilibrium (r², D, D')
    - `plink_score` — polygenic risk scoring with mean imputation
    - `plink_glm` — per-variant GWAS regression (linear, logistic, Firth)
    - `plink_pca` — principal component analysis via randomized SVD

    **Genotype output modes:**
    - `genotypes='struct'` — STRUCT with named fields per sample
    - `genotypes='counts'` — fast genotype counting (no decompression)
    - `genotypes='stats'` — counts + AF, MAF, missingness, heterozygosity

    **Flexible inputs:**
    - Unified `variants` parameter: indices, rsids, CPRA strings/structs, ranges
    - Parquet/CSV/table companions for variant and sample metadata
    - `af_range` / `ac_range` filter pushdown, and `include_genotypes` (hardcall
      category) / `genotype_range` for fast carrier lookups — in `orient := 'sample'`
      only the matching subjects are materialized

    **Remote / cloud reads:**
    - Read `.pgen` filesets directly from `s3://`, `https://`, and other DuckDB
      filesystems (companions too) — targeted/region queries fetch only the bytes
      they need via HTTP range reads. `plinking_pgen_io := 'localize'` downloads once
      for remote full scans. Split-index (`.pgen.pgi`) filesets are read transparently.

    All functions support projection pushdown (skip genotype decompression for
    metadata-only queries), parallel scanning, sample subsetting, and region
    filtering. Legacy PLINK 1 formats (.bim/.fam) are auto-detected.

    Built on [pgenlib](https://github.com/chrchang/plink-ng) for efficient access
    to the compressed .pgen binary format without full decompression.

    For full documentation, see [plinking-duck.readthedocs.io](https://plinking-duck.readthedocs.io).
