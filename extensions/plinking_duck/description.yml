extension:
  name: plinking_duck
  description: Read and write PLINK 2 genomics file formats and run common genetic analyses directly in SQL
  version: 0.14.2
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "windows_amd64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl"
  maintainers:
    - teaguesterling

repo:
  github: teaguesterling/plinking_duck
  # Post-#3079 keys: ref = the default build (the DuckDB 2.0 line, v2.0.0 once tagged);
  # variegata = the DuckDB v1.5.6 build (explicit, not left to fall back to ref);
  # ref_next = the dormant prerelease slot (build_next test_against_latest is if:false).
  # All three are the one v0.14.2 commit: a single source tree builds green on BOTH
  # lines. v0.14.2 is the DuckDB v2.0-cyanoptera compatibility release (and renames the howard catalog to pfile_catalog) — the pinned
  # cyanoptera CI leg built clean (linux amd64/arm64, osx amd64/arm64) and the full
  # unittest suite passes on both cyanoptera and the v1.5.6 ship line; the named-
  # parameter rework goes through named_parameter_compat.hpp (GetSignature().
  # WithTypedKwargs() on v2.0, the flat map on v1.5), same mechanism as the fleet.
  ref: 7a34f3ab8d76534aaebed0aaa88e8ef27099f4e6
  variegata: 7a34f3ab8d76534aaebed0aaa88e8ef27099f4e6
  ref_next: 7a34f3ab8d76534aaebed0aaa88e8ef27099f4e6

docs:
  hello_world: |
    -- Read variant metadata from a .pvar file
    SELECT CHROM, POS, ID, REF, ALT
    FROM read_pvar('cohort.pvar')
    WHERE CHROM = '22';

    -- Read genotypes in tidy format (one row per variant x sample)
    SELECT chrom, pos, iid, genotype
    FROM read_pfile('cohort', orient := 'genotype')
    LIMIT 10;

    -- Compute allele frequencies
    SELECT * FROM plink_freq('cohort.pgen')
    WHERE ALT_FREQ > 0.01;

    -- Run a GWAS association test
    SELECT * FROM plink_glm('cohort')
    WHERE p_value < 5e-8;

  extended_description: |
    PlinkingDuck brings [PLINK 2](https://www.cog-genomics.org/plink/2.0/) genotype,
    variant, and sample data into DuckDB, letting you query genomics datasets with
    standard SQL instead of format-specific command-line tools.

    **File readers:**
    - `read_pvar(path | [paths])` — variant metadata (.pvar/.bim); a list row-concatenates multiple files
    - `read_psam(path)` — sample metadata (.psam/.fam)
    - `read_pgen(path)` — binary genotypes (.pgen)
    - `read_pfile(prefix | [prefixes])` — unified fileset reader with orient modes (variant/genotype/sample), sample subsetting, region and variant filtering; accepts a list of prefixes to read a variant-sharded fileset (identical samples) as one table
    - `read_plink_vcf(path)` — fast biallelic genotype extraction from VCF/VCF.gz (~3x faster than htslib)

    **Writing & catalogs:**
    - `COPY (…) TO 'out' (FORMAT pvar | psam | pgen | pfile)` — write PLINK 2 filesets from SQL, including a `shard_by '<col>'` mode that splits a cohort into one fileset per key (e.g. per chromosome)
    - `.howard` catalog — a thin JSON catalog over a set of filesets (a shared `.pvar`/`.psam` plus per-file partition and genomic-range annotations); the sharded writer emits one as its manifest
    - `read_howard_manifest(path)` — parse, verify, and region-prune a `.howard` catalog, returning one row per surviving shard (with resolved companion paths, text or parquet)

    **Analysis functions:**
    - `plink_freq` — per-variant allele frequencies via fast genotype counting
    - `plink_hardy` — Hardy-Weinberg equilibrium exact test
    - `plink_missing` — per-variant or per-sample missingness rates
    - `plink_ld` — pairwise linkage disequilibrium (r², D, D')
    - `plink_score` — polygenic risk scoring with mean imputation
    - `plink_glm` — per-variant GWAS regression (linear, logistic, Firth)
    - `plink_pca` — principal component analysis via randomized SVD

    **Genotype output modes:**
    - `genotypes='struct'` — STRUCT with named fields per sample
    - `genotypes='counts'` — fast genotype counting (no decompression)
    - `genotypes='stats'` — counts + AF, MAF, missingness, heterozygosity

    **Flexible inputs:**
    - Unified `variants` parameter: indices, rsids, CPRA strings/structs, ranges
    - Parquet/CSV/table companions for variant and sample metadata
    - `af_range` / `ac_range` filter pushdown, and `include_genotypes` (hardcall
      category) / `genotype_range` for fast carrier lookups — in `orient := 'sample'`
      only the matching subjects are materialized

    **Remote / cloud reads:**
    - Read `.pgen` filesets directly from `s3://`, `https://`, and other DuckDB
      filesystems (companions too) — targeted/region queries fetch only the bytes
      they need via HTTP range reads. `plinking_pgen_io := 'localize'` downloads once
      for remote full scans. Split-index (`.pgen.pgi`) filesets are read transparently.

    All functions support projection pushdown (skip genotype decompression for
    metadata-only queries), parallel scanning, sample subsetting, and region
    filtering. Legacy PLINK 1 formats (.bim/.fam) are auto-detected.

    Built on [pgenlib](https://github.com/chrchang/plink-ng) for efficient access
    to the compressed .pgen binary format without full decompression.

    For full documentation, see [plinking-duck.readthedocs.io](https://plinking-duck.readthedocs.io).
