  # scripts/build.py sends a v1.5.6 build to this ref if present and to `ref`
  # otherwise -- and unlike ref_next it has no skip branch, so once `ref` moves to
  # a 2.0-only commit a v1.5.6 build would FAIL rather than be skipped. Set equal to
  # `ref` while both lines still build; advance it only to a commit v1.5.6 can build.
