extension:
  name: func_apply
  description: Dynamic function invocation - call any scalar function or macro by name at runtime
  version: 0.4.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - teaguesterling
repo:
  github: teaguesterling/duckdb_func_apply
  ref: 9f119877ef5c10ef84c8cc593ee98ee199be5302
