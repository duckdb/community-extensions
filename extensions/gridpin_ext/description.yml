extension:
  name: gridpin_ext
  description: Geocode addresses inside DuckDB offline — forward and reverse geocoding from one country file, no server, no API key
  version: 0.10.0
  language: Rust
  build: cargo
  license: Apache-2.0
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
  opt_in_platforms: "osx_amd64"
  requires_toolchains: "rust;python3"
  maintainers:
    - gridpin-reserve

repo:
  github: gridpin/duckdb-gridpin
  variegata: b548065337b09a0ed9a2d34cc470563937be9e3b
  ref: b548065337b09a0ed9a2d34cc470563937be9e3b

docs:
  hello_world: |
    -- Country data files are free downloads: https://gridpin.dev
    -- (Australia, Brazil, Canada, France, Germany, Italy, Mexico, the Netherlands, New Zealand, Poland, Serbia, Spain and the United States today; one file per country.)
    LOAD gridpin_ext;

    -- Point the extension at a downloaded sheet. One sheet is loaded at a time.
    SELECT gridpin_load('./france.bin');

    -- Forward geocoding: an address string in, a JSON object out.
    SELECT gridpin_geocode('10 rue de rivoli paris');

    -- Reverse geocoding: coordinates in, the nearest address out.
    SELECT gridpin_reverse(48.8686, 2.3305);

    -- It is an ordinary scalar function, so a whole table geocodes in one query.
    SELECT id,
           json_extract(gridpin_geocode(address), '$.lat') AS lat,
           json_extract(gridpin_geocode(address), '$.lon') AS lon
    FROM customers;
  extended_description: |
    GridPin geocodes addresses inside DuckDB **entirely offline**: `gridpin_geocode(address)` turns an address
    string into coordinates, and `gridpin_reverse(lat, lon)` turns coordinates into the nearest street address. It
    reads one memory-mapped file per country, answers in milliseconds on a single core and tolerates typos. There is
    no server to run, no database to import, no API key and no per-request fee — the addresses you geocode never
    leave the machine.

    ### Functions

    | Function | Purpose |
    |---|---|
    | `gridpin_load(path)` | memory-map a country sheet; the last path wins |
    | `gridpin_geocode(address)` | address string → JSON object with `lat`, `lon`, `street`, `city` |
    | `gridpin_reverse(lat, lon)` | coordinates → JSON object for the nearest address |
    | `gridpin_load_poi(path)` | optional points-of-interest layer, consulted after addresses |
    | `gridpin_reset()` | drop the loaded sheet so another country can be loaded |

    Every function carries a description and parameter names, so SQL assistants and
    AI agents can discover them through `duckdb_functions()`.

    A query issued before `gridpin_load` is a clear error rather than a crash, and an
    address with no match returns `{}` — an empty result is a documented contract, not a
    guess.

    ### Data files

    Country sheets are free downloads at [gridpin.dev](https://gridpin.dev/docs#delivery) and in the [releases of
    the main repository](https://github.com/gridpin/gridpin/releases): Australia, Brazil, Canada, France, Germany, Italy, Mexico, the Netherlands, New Zealand, Poland, Serbia, Spain and the United States.
    The sheets are built from Overture Maps addresses and national open address registers; each carries its own
    source licence, listed in [ATTRIBUTIONS.md](https://github.com/gridpin/gridpin/blob/main/ATTRIBUTIONS.md). What
    each country covers and where it is thin is on its page under [gridpin.dev/guides](https://gridpin.dev/guides).
    The engine itself is Apache-2.0 and lives at [gridpin/gridpin](https://github.com/gridpin/gridpin); this
    repository holds the extension crate only.

    ### Licences

    The extension statically links the Rust libraries listed in
    [THIRDPARTY.yml](https://github.com/gridpin/duckdb-gridpin/blob/main/THIRDPARTY.yml),
    which carries their licence texts.
