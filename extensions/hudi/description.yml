extension:
  name: hudi
  description: "Query Apache Hudi COW and MOR tables directly in DuckDB - full scans, time-travel (as_of), incremental windows, table metadata, and SQL filter pushdown into the Rust hudi-rs kernel (partition + file-slice pruning). 0.3.0 is a C++ in-tree extension wrapping the Rust kernel."
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw;windows_amd64_rtools"
  requires_toolchains: "rust"
  maintainers:
    - alitrack

repo:
  github: alitrack/duckdb-hudi
  ref: refs/tags/v0.3.0

docs:
  hello_world: |
    -- Read a Hudi COW table
    INSTALL hudi FROM community;
    LOAD hudi;
    SELECT * FROM read_hudi('/path/to/hudi_table')
    WHERE dt = '2026-01-01';

    -- Time-travel to the latest commit <= an instant
    SELECT * FROM read_hudi('/path/to/hudi_table', as_of => '20260101000000000');

    -- Incremental read of changes in (start, end]
    -- (end is a reserved word, so quote it as a named parameter)
    SELECT * FROM read_hudi('/path/to/hudi_table', start => '20260101000000000', "end" => '20260102000000000');

  extended_description: |
    ## duckdb-hudi

    DuckDB extension that reads Apache Hudi (COW and MOR) tables using the
    hudi-rs Rust kernel. Source: https://github.com/alitrack/duckdb-hudi

    ### Install
        INSTALL hudi FROM community;
        LOAD hudi;

    ### Features
    - Full scan of COW and MOR Hudi tables
    - Time-travel via as_of (query a table at a specific instant)
    - Incremental reads (new/changed records since a checkpoint)
    - Table schema + metadata queries (hudi_info / hudi_commits / hudi_mdt / hudi_stats)
    - Parallel scanning
    - SQL filter pushdown: comparisons, IN, BETWEEN and AND chains push into
      the hudi-rs kernel for partition + file-slice pruning

    ### 0.3.0 build model (read before building)
    0.3.0 is a C++ in-tree extension wrapping the Rust kernel staticlib
    (the C-ABI-only 0.2.x build is gone). It follows DuckDB minor versions:
    master tracks the current 1.5.x line, and a v2.0 branch tracks 2.0.x.
    The Rust tree still needs protoc at compile time (Lance pulls
    prost-build); when neither PROTOC nor a system protoc is available the
    CMake build bootstraps a pinned prebuilt protoc into third_party/protoc.
