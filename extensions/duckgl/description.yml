extension:
  name: duckgl
  description: DuckDB geospatial visualization with deck.gl and MapLibre
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - nkwork9999

repo:
  github: nkwork9999/duckgl
  ref: 3802d97a9e49276ff45a244bd60c2b923f165050

docs:
  hello_world: |
    -- Start DuckGL server
    SELECT duckgl_start('localhost', 8080);

    -- Open http://localhost:8080 in browser

    -- Stop server
    SELECT duckgl_stop();

  extended_description: |
    DuckGL provides a web-based geospatial visualization interface for DuckDB.

    ## Features
    - Interactive map visualization using deck.gl and MapLibre
    - GeoJSON layer rendering from spatial tables
    - SQL query execution from browser UI

    **HTML and PDF reports**:
    Export HTML downloads an offline snapshot containing the last successful SQL query, all returned rows,
    and a north-up SVG geometry overview without base-map tiles. Export PDF opens that report in the
    browser print dialog; choose Save as PDF. Saved HTML contains no scripts and does not execute SQL.

    **Map analysis and additional exports**:
    Inspect table columns, choose a geometry column, specify the source CRS for WGS84 conversion,
    map a spatial SELECT query, and click features to inspect their attributes.
    Download query results as CSV or JSON, and map data as GeoJSON, SVG, PNG, or interactive HTML.
    Interactive HTML embeds the data and runs without the DuckGL server, but needs internet access
    for map libraries and base-map tiles. SVG and PNG are north-up geometry overviews without tiles.
    Attached database selection and large integer identifiers retain their exact identity.

    The host can publish a committed WGS84 view as a read-only GeoJSON snapshot with
    duckgl_start_layer(0, view_name). It returns an ephemeral loopback port serving GET
    /api/layer. Call duckgl_stop_layer() on the same connection to close it. The source
    repository also includes a Python viewport and point-grid API.

    The embedded Python API also exposes typed layer filters, viewport geometry, point vector tiles,
    versioned detail lookup, and exact counts of points within registered polygons.

    [English project documentation](https://nkwork9999.github.io/duckgl/).
