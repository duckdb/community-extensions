extension:
  name: duckgl
  description: DuckDB geospatial visualization with deck.gl and MapLibre
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - nkwork9999

repo:
  github: nkwork9999/duckgl # あなたのリポジトリ名に合わせて
  ref: dc865ab2348f7e0e583d53eca12055515bc04e13

docs:
  hello_world: |
    -- Start DuckGL server
    SELECT duckgl_start('localhost', 8080);

    -- Open http://localhost:8080 in browser

    -- Stop server
    SELECT duckgl_stop();

  extended_description: |
    DuckGL provides a web-based geospatial visualization interface for DuckDB.

    ## Features
    - Interactive map visualization using deck.gl and MapLibre
    - GeoJSON layer rendering from spatial tables
    - SQL query execution from browser UI

    **HTML and PDF reports**:
    Export HTML downloads an offline snapshot containing the last successful SQL query, all returned rows,
    and a north-up SVG geometry overview without base-map tiles. Export PDF opens that report in the
    browser print dialog; choose Save as PDF. Saved HTML contains no scripts and does not execute SQL.
