extension:
  name: erpl_web
  description: This extension is an alias to the erpl_odata extension. erpl_web was renamed to erpl_odata; loading erpl_web installs and loads erpl_odata, so existing scripts keep working. New code should use erpl_odata directly.
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: "python3"
  maintainers:
    - jrosskopf
  excluded_platforms: "windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;"
repo:
  github: duckdb/duckdb-extension-alias
  ref: 7e7a9c0dd16ad46b3c2da4e96dedbfbce4aa67ae
  canonical_name: erpl_odata

docs:
  hello_world: |
    -- erpl_web was renamed to erpl_odata. Loading the old name loads the new extension:
    INSTALL erpl_web FROM community;
    LOAD erpl_web;

    -- New code should use the new name directly:
    INSTALL erpl_odata FROM community;
    LOAD erpl_odata;

    SELECT * FROM http_get('https://httpbin.org/ip');
