extension:
  name: panduck
  description: Read documents natively into the duck_block vocabulary -- DOCX, ODT, EPUB, RTF, LaTeX, Org, RST, ipynb, MediaWiki and Textile -- and write them back as Pandoc JSON, without linking Pandoc
  version: 0.9.1
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: vcpkg
  maintainers:
    - teaguesterling
  # The default pin from extension-ci-tools v1.5.5, which is what panduck's own
  # distribution pipeline builds green against on every platform including wasm.
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: teaguesterling/duckdb_panduck
  ref: b90650547b36691f307571e13f480079ccd0c5f4
  # variegata pins the v1.5.6 track. scripts/build.py sends a v1.5.6 build here when
  # present and to `ref` otherwise, and unlike ref_next it has no skip branch -- so
  # once `ref` is 2.0-only a v1.5.6 build would fail rather than be skipped. Advance
  # only to a commit v1.5.6 can still build.
  #
  # HELD AT 0.7.0 FOR 0.9.1, deliberately. panduck's CI retired its v1.5.6 leg when
  # v2.0.0 became the shipping line, so no v1.5.6 build of `ref` has been measured, and
  # one call in `ref` uses a Catalog::GetEntry overload that v1.5.6 does not have.
  # v1.5.6 users stay on 0.7.0, which is the release paired with duck_block_utils 4.0.0.
  variegata: dc094ee3261251a69f3f394b775709a682fb0640
  # MEASURED for 0.9.1 on this exact commit:
  #   v2.0.0 linux_amd64 suite on longbottom, clean build: 3247 assertions, 0 failed.
  #     The new reader_registry_git.test skips there (a local build's INSTALL from
  #     community 404s); its 9 assertions pass with duck_tails 1.9.0 loaded by path.
  #   panduck CI on this commit (run 43156589515): every v2.0.0 and v2.0-line build passes,
  #     including wasm_mvp, wasm_eh and wasm_threads; Linux tests 38 passed, 5 gated skips,
  #     reader_registry_git.test included. Three DuckDB-main canary legs (osx_arm64 and
  #     both Windows) were cancelled by a later push to panduck main.
  #   The CI wasm_eh artifact of this commit loads in @duckdb/duckdb-wasm 1.33.1-dev114.0
  #     (v2.0.0, d54cbbe3df) in Node, with duck_block_utils 4.0.0. 28 queries give output
  #     identical to the native linux_amd64 artifact: 0.9.0's 26 plus 2 git:// cases.
  #
  # ref_next STAYS SET even when it equals ref: without it scripts/build.py prints "Skipping
  # prerelease validation" and test_against_latest never runs -- a green that means "did not
  # look". panduck v0.2.0 merged that way, and the job has since caught two real defects.
  # A STALE ref_next is worse than an absent one: it validates the PREVIOUS release
  # against the next line while reporting green, so it moves with ref every release.
  ref_next: b90650547b36691f307571e13f480079ccd0c5f4
docs:
  hello_world: |
    LOAD panduck;

    -- Read a document straight into flattened duck_block rows
    SELECT * FROM read_docx_blocks('report.docx');
    SELECT * FROM read_epub_blocks('book.epub');
    SELECT * FROM read_latex_blocks('paper.tex');

    -- Every reader goes through DuckDB's filesystem, so any path DuckDB can open
    -- works: httpfs, s3://, encrypted, in-memory
    LOAD httpfs;
    SELECT * FROM read_docx_blocks('https://example.org/report.docx');

    -- Or let the path pick the reader
    SELECT * FROM panduck_read_blocks('notes.org');
    SELECT panduck_format_for('paper.tex');       -- 'latex'
    SELECT panduck_can_read('archive.docx');      -- true

    -- Formats with no file: parse a string directly
    SELECT * FROM read_mediawiki_blocks_string('== Heading ==');

    -- Outline any supported document
    SELECT * FROM doc_toc('report.docx');

    -- Pull one section out, by heading or by a fragment of one
    SELECT * FROM doc_section('report.docx', 'Methods');
    SELECT * FROM doc_section('report.docx', 'Meth', match := 'contains');

    -- ...or find the section by what it SAYS rather than what it is called
    SELECT * FROM doc_search_sections('report.docx', 'p < 0.05');

    -- Glob patterns: * is any run, ? is one character; % _ and \ are literal
    SELECT * FROM doc_section('report.docx', 'Meth*s', match := 'glob');

    -- The same narrowing over a blocks list, for blocks that never were a file
    WITH d AS (SELECT list(b ORDER BY b.element_order) AS blocks
               FROM read_odt_blocks('doc.odt') b)
    SELECT * FROM doc_section_blocks((SELECT blocks FROM d), 'Methods');

    -- Reading mode: the page without its nav, aside and page header and footer
    SELECT * FROM doc_reader('page.html');

    -- Render one back out (md, html or text)
    SELECT doc_render('report.docx', 'md');

    -- Write back out as Pandoc JSON that a real pandoc accepts
    SELECT panduck_write_pandoc_ast('doc.json',
        (SELECT list(b) FROM read_odt_blocks('doc.odt') b)
    );

    -- Or get the AST as a struct without touching the filesystem
    SELECT panduck_blocks_to_pandoc_ast(
        (SELECT list(b) FROM read_rtf_blocks('memo.rtf') b)
    );

  extended_description: |
    Panduck reads document formats natively into the `duck_block` vocabulary shared
    with `duck_block_utils`, `markdown` and `webbed` -- so a DOCX, an EPUB and a
    LaTeX paper all land in the same seven-column shape and can be queried together.

    **It does not link Pandoc.** Pandoc is a Haskell program; the only C bindings
    that ever existed went unmaintained in 2017, and a Cabal foreign-library request
    has been open upstream since 2020. Linking the GHC runtime into a dlopen'd DuckDB
    extension would be a bad neighbour even if it existed. Panduck is instead
    compatible with Pandoc's **data model**: every reader is hand-written, and a
    checked mapping table pins the correspondence to Pandoc's AST constructors.

    ## Readers

    | Function | Format |
    |----------|--------|
    | `read_docx_blocks(path)` | Word OOXML |
    | `read_odt_blocks(path)` | OpenDocument Text |
    | `read_epub_blocks(path)` | EPUB 2/3 |
    | `read_rtf_blocks(path)` | Rich Text Format |
    | `read_latex_blocks(path)` | LaTeX |
    | `read_org_blocks(path)` | Org mode |
    | `read_rst_blocks(path)` | reStructuredText |
    | `read_ipynb_blocks(path)` | Jupyter notebooks |
    | `read_mediawiki_blocks(path)` | MediaWiki wikitext |
    | `read_textile_blocks(path)` | Textile |
    | `read_pandoc_blocks(path)` | Pandoc JSON AST (reaches all 43 formats pandoc reads) |

    Every text format also has a `_string` variant that parses content directly.
    DOCX, ODT, EPUB and RTF read lists, blockquotes, tables, images and footnotes, and an
    RST footnote or citation reference joins its body by `attributes['id']`;
    document metadata is extracted for every format that has any.

    ## Dispatch

    | Function | Description |
    |----------|-------------|
    | `panduck_read_blocks(path)` | Read any supported path, reader chosen by extension |
    | `panduck_format_for(path)` | Which format a path resolves to |
    | `panduck_can_read(path)` | Whether a path is supported |
    | `panduck_supported_extensions()` | The registry, as a table |
    | `panduck_register_doc_reader(...)` | Register a reader at runtime |

    ## Document helpers

    | Function | Description |
    |----------|-------------|
    | `doc_toc(path)` | Table of contents for any supported document |
    | `doc_section(path, heading)` | The blocks under one heading (`match := 'contains'` for a fragment, `'glob'` for `*` and `?`) |
    | `doc_search_sections(path, pattern)` | The section whose CONTENT matches, not its heading (`match := 'glob'` too) |
    | `doc_section_blocks(blocks, heading)` | `doc_section` over a duck_block list rather than a path |
    | `doc_search_sections_blocks(blocks, pattern)` | `doc_search_sections` over a duck_block list |
    | `doc_reader(path)` | Reading mode: drop a page's nav, aside, and header and footer outside an article |
    | `doc_reader_blocks(blocks)` | `doc_reader` over a duck_block list |
    | `panduck_glob_like(pattern)` | The glob-to-`LIKE` translation the glob mode uses |
    | `doc_container(path, id)` | The blocks inside one container |
    | `doc_render(path, fmt)` | Render a document to `md`, `html` or text |

    Each of these accepts `expand_embedded := true`, which parses a format embedded in a
    document -- a markdown cell inside a `.ipynb` -- so a notebook is navigable rather
    than a wall of `raw` blocks. Opt-in: it needs the `markdown` extension, and an
    unchanged call reads identically without it.

    ## Writing Pandoc JSON

    | Function | Description |
    |----------|-------------|
    | `panduck_blocks_to_pandoc_ast(blocks)` | duck_block list to a Pandoc AST document |
    | `panduck_blocks_to_pandoc_blocks(blocks)` | duck_block list to a Pandoc block array |
    | `panduck_blocks_to_pandoc_json(blocks)` | duck_block list to Pandoc JSON text |
    | `panduck_write_pandoc_ast(path, blocks)` | Write Pandoc JSON to a file |
    | `panduck_pandoc_ast_map()` | The constructor mapping, as a queryable table |

    Since 0.7.0, panduck also registers the converter names that `duck_block_utils` used
    to register: `pandoc_ast_to_blocks`, `read_pandoc_ast`, `write_pandoc_ast`,
    `duck_blocks_to_pandoc_ast`, `duck_blocks_to_pandoc_blocks`, `pandoc_ast`,
    `pandoc_inlines_to_db_inlines`, `pandoc_inlines_to_text` and
    `duck_blocks_inlines_to_pandoc`. Load it with a `duck_block_utils` release that no
    longer registers them.

    The governing rule is that panduck may be **more** faithful than pandoc -- richer
    attributes, better block types, metadata pandoc does not extract -- so long as the
    mapping back to valid Pandoc JSON stays total. Every fixture and a set of
    hand-built constructs are round-tripped through a real pandoc in CI to hold that.

    ## Scope

    This is an early release. Ten native readers are implemented and tested against
    reference implementations -- RTF, DOCX, ODT, EPUB, LaTeX, Org, RST, ipynb, MediaWiki,
    Textile -- plus a Pandoc AST reader, with 3247 test assertions, differential validation
    against a real pandoc on every fixture, and CI that builds and tests against DuckDB
    v2.0.0, the v2.0 line and main. PDF, Markdown and HTML
    are read by delegating to the pdf, markdown and webbed extensions rather than by a
    reader here.

    The readers were audited over five rounds before this release, each round asking a
    question the previous one could not answer -- does a construct come back at all, do
    any words go missing, do all ten readers agree on one logical document. That found
    18 defects, including silent text loss in DOCX where a hyperlink's anchor text was
    dropped outright. All are fixed and pinned by tests. Three findings remain open and
    are recorded in the documentation rather than omitted.

    Known divergences from pandoc are declared and reasoned in the repository's
    roundtrip ledger rather than hidden -- including several where pandoc is the one
    losing information.
