extension:
  name: docn
  description: DigitalOcean AI-Native Cloud services as SQL functions
  version: 0.1.0
  language: C/C++
  build: CMake
  license: MIT
  requires_toolchains: "vcpkg;python3"
  vcpkg_commit: "84bab45d415d22042bd0b9081aea57f362da3f35"
  # Requests need libcurl, which is not available in the browser (Wasm) builds.
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw"
  opt_in_platforms: "osx_amd64;linux_amd64_musl;linux_arm64_musl;windows_arm64"
  maintainers:
    - MehulBatra

repo:
  github: digitalocean-labs/duckdb-do
  ref: 02039868b47efa85a9fd0f14b38aac8f86cc92b3

docs:
  hello_world: |
    -- Set your key in the shell before starting DuckDB:
    --   export DO_MODEL_ACCESS_KEY='...'
    -- or inside DuckDB: SET do_model_access_key = '...';
    LOAD docn;

    -- List the available models (no key needed)
    SELECT name, type FROM do_models() LIMIT 5;

    -- A few rows to work with
    CREATE TABLE reviews AS
        FROM (VALUES
            ('The app crashes every time I upload a photo.'),
            ('Fast delivery and great support, thank you!'),
            ('I was charged twice this month.')
        ) t(review);

    -- Yes/no question per row: 0.97 means very likely yes
    SELECT review, (do_decide(review, 'Is the customer happy?') ->> 'noul')::DOUBLE AS happy
    FROM reviews;

    -- Pick one label per row: bug, praise, billing
    SELECT review, do_decide(review, 'What is this about?', 'choice', ['bug', 'billing', 'praise']) ->> 'choice' AS topic
    FROM reviews;

    -- Free text answer per row
    SELECT review, do_prompt('Reply to this review in one sentence: ' || review) AS reply
    FROM reviews;

    -- Similarity search with embeddings
    SELECT review
    FROM reviews
    ORDER BY list_cosine_similarity(do_embed(review), do_embed('billing issue')) DESC
    LIMIT 1;
  extended_description: |
    The docn extension brings the DigitalOcean AI-Native Cloud to DuckDB. It exposes
    DigitalOcean services as SQL functions, starting with Serverless Inference:
    do_models lists the available models, do_decide answers closed questions
    (yes/no, choice, score) about text, do_prompt sends prompts to chat models and
    do_embed turns text into embedding vectors.
    See https://github.com/digitalocean-labs/duckdb-do for documentation.
