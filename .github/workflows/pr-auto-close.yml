name: Close a PR after 1 month of inactivity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  auto-close:
    if: github.repository == 'duckdb/community-extensions' || github.event_name != 'schedule' # better way to describe that job can be run for funsies?
    runs-on: ubuntu-latest
    strategy:
      matrix:
        label: ['CI failure', 'changes requested']

    steps:
      - uses: actions/stale@v9
        with:
          only-labels: ${{ matrix.label }}
          # pr becomes stale after 23 days of inactivity, closed a week later if no updates
          days-before-pr-stale: 23
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has had no activity for 23 days. It will be closed in 7 day if there is no new activity.
          close-pr-message: >
            Closing this PR do to 30 days of inactivity. Feel free to reopen it once the ${{ matrix.label }} has been addressed.