name: Release Material Publication Tests

on:
  pull_request:
    paths:
      - scripts/build.py
      - scripts/release_materials.py
      - tests/**
      - .github/workflows/test_release_materials.yml
      - .github/workflows/build.yml
      - .github/workflows/_extension_deploy.yml
  push:
    branches: [main]
    paths:
      - scripts/build.py
      - scripts/release_materials.py
      - tests/**
      - .github/workflows/test_release_materials.yml
      - .github/workflows/build.yml
      - .github/workflows/_extension_deploy.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: v1.5.5
          path: duckdb
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -v
        env:
          DUCKDB_UPLOAD_SCRIPT: ${{ github.workspace }}/duckdb/scripts/extension-upload-single.sh
