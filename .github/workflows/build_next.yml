name: Community Extension with latest DuckDB
on:
  pull_request:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build_next.yml'
      - '!extensions/*/description.yml'
  push:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build_next.yml'
      - '!extensions/*/description.yml'

jobs:
  test_against_latest:
    uses: ./.github/workflows/build.yml 
    with:
      duckdb_version: 'v2.0-cyanoptera'
      ci_tools_version: 'main'
      deploy: 'false'
      require_ref_next: true
