name: Community Extension Generate Docs
on:
  workflow_dispatch:
    inputs:
      # optionally generate docs for only one extension, installed from the community repository
      extension_name:
        type: string
      # if set, the extension is installed from this run's build artifact instead of the community repository
      duckdb_version:
        type: string
  workflow_call:
    inputs:
      extension_name:
        type: string
      # if set, the extension is installed from this run's build artifact instead of the community repository
      duckdb_version:
        type: string

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: 'duckdb/community-extensions'

    # Sets up a CLI for every DuckDB version in the compatibility matrix, so that extensions which are
    # not available for the newest version are still documented using the newest version they support
    - name: Set up DuckDB
      run: |
        curl -sf https://raw.githubusercontent.com/duckdb/duckdb-web/main/_data/past_releases.csv -o duckdb-releases.csv
        DUCKDB_CLIS=""
        for version in $(python3 scripts/compatibility_matrix.py --versions duckdb-releases.csv); do
          # e.g. a release listed in past_releases.csv before its CLI is published; skip it instead of failing
          mkdir -p duckdb_cli/v$version
          if wget -q https://github.com/duckdb/duckdb/releases/download/v$version/duckdb_cli-linux-amd64.zip &&
             unzip -q duckdb_cli-linux-amd64.zip -d duckdb_cli/v$version; then
            chmod +x duckdb_cli/v$version/duckdb
            DUCKDB_CLIS="$DUCKDB_CLIS ./duckdb_cli/v$version/duckdb"
          else
            echo "::warning::Could not download the DuckDB v$version CLI, extensions will not be documented using this version"
          fi
          rm -f duckdb_cli-linux-amd64.zip
        done
        if [ -z "$DUCKDB_CLIS" ]; then
          echo "::error::Could not download any DuckDB CLI"
          exit 1
        fi
        # newest first
        echo "DUCKDB_CLIS=$DUCKDB_CLIS" >> $GITHUB_ENV
        # the newest version is also used on its own, e.g. to install a downloaded artifact
        cp $(echo $DUCKDB_CLIS | cut -d ' ' -f 1) ./duckdb

    - name: Fetch extensions
      if: ${{ inputs.extension_name == '' }}
      run: |
        ./scripts/fetch_extensions.sh $DUCKDB_CLIS

    # Artifacts only exist within the run that built them, so this is for use via workflow_call
    - uses: actions/download-artifact@v4
      if: ${{ inputs.extension_name != '' && inputs.duckdb_version != '' }}
      with:
        name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version}}-extension-linux_amd64
        path: build/downloaded

    - name: Install downloaded extension
      if: ${{ inputs.extension_name != '' && inputs.duckdb_version != '' }}
      env:
        NAME: ${{ inputs.extension_name }} 
      run: |
        ./duckdb -unsigned -c "SET extension_directory = 'build/extension_dir'; FORCE INSTALL 'build/downloaded/$NAME.duckdb_extension';"

    - name: Install extension from community repository
      if: ${{ inputs.extension_name != '' && inputs.duckdb_version == '' }}
      env:
        NAME: ${{ inputs.extension_name }}
      run: |
        for binary in $DUCKDB_CLIS; do
          $binary -c "SET extension_directory = 'build/extension_dir'; FORCE INSTALL '$NAME' FROM community;" && break
        done

    - name: Generate docs
      run: |
        ./scripts/generate_md.sh $DUCKDB_CLIS
        ./scripts/generate_extensions_json.py
        zip -r build/generated_md.zip build/docs

    - uses: actions/upload-artifact@v4
      with:
        name: generated_markdowns
        path: |
          build/generated_md.zip
